name: Build Droid2iOS Studio

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Droid2iOS-Studio-Windows
          path: release/*
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: Droid2iOS-Studio-Linux
          path: release/*
          retention-days: 14
